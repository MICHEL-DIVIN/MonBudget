services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monbudget
      POSTGRES_PASSWORD: monbudget
      POSTGRES_DB: monbudget
    ports:
      - "5433:5432"
    volumes:
      - monbudget-pg:/var/lib/postgresql/data

volumes:
  monbudget-pg:
